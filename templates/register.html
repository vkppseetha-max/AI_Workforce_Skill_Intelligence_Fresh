{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="form-card"><h2>Create Account</h2><p class="muted">Create your own workspace. Your skill data is stored separately.</p>
<form method="post">
<label>Name<input name="name" required></label>
<label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="6" required></label>
<label>Confirm Password<input type="password" name="confirm_password" minlength="6" required></label>
<button class="btn full" type="submit">Register</button>
</form>
<p class="center muted">Already have an account? <a href="{{ url_for('login') }}">Login</a></p></div>
{% endblock %}
